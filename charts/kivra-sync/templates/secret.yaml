{{- include "kivra-sync.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kivra-sync.fullname" . }}
  labels:
    {{- include "kivra-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.ssn }}
  ssn: {{ include "kivra-sync.ssn" . | quote }}
  {{- end }}
  {{- if eq .Values.storage.provider "paperless" }}
  paperless-token: {{ .Values.storage.paperless.token | quote }}
  {{- end }}
  {{- if include "kivra-sync.usesNtfyPassword" . }}
  ntfy-password: {{ .Values.interaction.ntfy.password | quote }}
  {{- end }}
{{- end }}
